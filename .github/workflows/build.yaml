name: Build Executables

on:
  push:
    tags: ["*"]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update rust
        run: |
          rustup default nightly
          rustup update
          rustc --version
          cargo --version

      - name: Build pleep-search
        run: cargo build --release --bin pleep-search

      - name: Build pleep-build-action
        run: cargo build --release --bin pleep-build-action

      - name: Create release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            target/release/pleep-search
            target/release/pleep-build-action
